<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text-to-Speech Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f9f9f9;
    }
    textarea {
      width: 100%;
      height: 150px;
      font-size: 16px;
    }
    select, button {
      margin-top: 15px;
      padding: 10px;
      font-size: 16px;
    }
    label {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Text-to-Speech</h1>

  <textarea id="text" placeholder="Type or paste your text here..."></textarea>

  <br><br>

  <label for="language">Choose Language:</label>
  <select id="language" onchange="populateVoices()"></select>

  <br><br>

  <label for="voice">Choose Voice:</label>
  <select id="voice"></select>

  <br><br>

  <button onclick="speak()">Speak</button>
  <button onclick="stop()">Stop</button>

  <script>
    let voices = [];

    function getFullLanguageName(langCode) {
      const langMap = {
        "en-US": "English (US)",
        "en-GB": "English (UK)",
        "sv-SE": "Swedish",
        "fr-FR": "French (France)",
        "de-DE": "German",
        "es-ES": "Spanish (Spain)",
        "it-IT": "Italian",
        "ja-JP": "Japanese",
        "ko-KR": "Korean",
        "zh-CN": "Chinese (Mandarin)",
        // Add more as needed
      };
      return langMap[langCode] || langCode;
    }

    function populateLanguages() {
      const languageSelect = document.getElementById('language');
      const uniqueLangs = [...new Set(voices.map(voice => voice.lang))];
      languageSelect.innerHTML = uniqueLangs.map(lang => 
        `<option value="${lang}">${getFullLanguageName(lang)}</option>`
      ).join('');
    }

    function populateVoices() {
      const voiceSelect = document.getElementById('voice');
      const selectedLang = document.getElementById('language').value;
      const filtered = voices.filter(voice => voice.lang === selectedLang);
      voiceSelect.innerHTML = filtered.map((voice, i) => 
        `<option value="${i}">${voice.name} (${getFullLanguageName(voice.lang)})</option>`
      ).join('');
    }

    function speak() {
      stop(); // Stop any ongoing speech
      const text = document.getElementById('text').value;
      const selectedVoiceIndex = document.getElementById('voice').value;
      const utterance = new SpeechSynthesisUtterance(text);
      if (voices[selectedVoiceIndex]) {
        utterance.voice = voices[selectedVoiceIndex];
      }
      window.speechSynthesis.speak(utterance);
    }

    function stop() {
      window.speechSynthesis.cancel();
    }

    function loadVoices() {
      voices = window.speechSynthesis.getVoices().filter(v => v.voiceURI && !v.name.includes("Google Translate"));
      populateLanguages();
      populateVoices();
    }

    window.speechSynthesis.onvoiceschanged = loadVoices;
  </script>

</body>
</html>
