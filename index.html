<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple TTS App</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
    label, select, textarea, button { display: block; width: 100%; margin: 1rem 0; }
    textarea { height: 120px; }
  </style>
</head>
<body>
  <h1>Text-to-Speech Demo</h1>

  <label for="language">Language</label>
  <select id="language">
    <option value="en-US">English (US)</option>
    <option value="en-GB">English (UK)</option>
    <option value="fr-FR">French</option>
    <option value="sv-SE">Swedish</option>
  </select>

  <label for="voice">Voice</label>
  <select id="voice"></select>

  <label for="text">Text</label>
  <textarea id="text" placeholder="Enter your text here..."></textarea>

  <button onclick="speak()">▶ Start</button>
  <button onclick="stop()">⏹ Stop</button>

  <script>
    const languageSelect = document.getElementById('language');
    const voiceSelect = document.getElementById('voice');
    const textArea = document.getElementById('text');

    let voices = [];

    function loadVoices() {
      voices = speechSynthesis.getVoices();
      populateVoices(languageSelect.value);
    }

    function populateVoices(language) {
      voiceSelect.innerHTML = '';
      const filtered = voices.filter(voice => voice.lang === language);
      filtered.forEach(voice => {
        const option = document.createElement('option');
        option.value = voice.name;
        option.textContent = voice.name;
        voiceSelect.appendChild(option);
      });
    }

    languageSelect.addEventListener('change', () => {
      populateVoices(languageSelect.value);
    });

    function speak() {
      stop(); // stop any ongoing speech
      const utterance = new SpeechSynthesisUtterance(textArea.value);
      const selectedVoice = voices.find(v => v.name === voiceSelect.value);
      if (selectedVoice) utterance.voice = selectedVoice;
      speechSynthesis.speak(utterance);
    }

    function stop() {
      speechSynthesis.cancel();
    }

    window.speechSynthesis.onvoiceschanged = loadVoices;
  </script>
</body>
</html>
